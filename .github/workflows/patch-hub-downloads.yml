name: Patch Hub downloads

on:
  push:
    branches:
      - main
    paths:
      - .github/hub-download-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/patch_hub_downloads.py
      - run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: add Hub app downloads to website"
          git push origin main
