name: Auto-fix Script Searcher desktop layout

on:
  push:
    paths:
      - '.github/workflows/auto-fix-script-searcher-layout.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Trigger desktop Script Searcher layout fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch layout
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '''        @media (max-width: 820px) {
            .script-searcher__tabs {
'''
          patch = '''        @media (min-width: 1100px) {
            #px .script-searcher__panels {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 12px;
            }

            #px .script-searcher__panel {
                min-width: 0;
                padding: 14px;
            }

            #px .script-searcher__panel-controls {
                gap: 4px;
            }

            #px .script-searcher__panel-controls button {
                padding: 4px 8px;
            }

            #px .script-searcher__panel-page {
                min-width: 58px;
            }
        }

'''
          assert marker in text, 'Script Searcher mobile breakpoint not found'
          if 'grid-template-columns: repeat(4, minmax(0, 1fr));' not in text:
              text = text.replace(marker, patch + marker, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'grid-template-columns: repeat(4, minmax(0, 1fr));' index.html
          grep -q '@media (max-width: 820px)' index.html
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/auto-fix-script-searcher-layout.yml
          git rm -f .github/workflows/apply-script-searcher-layout.yml
          git rm -f .github/workflows/fix-script-searcher-desktop.yml
          git add index.html
          git commit -m 'Keep all Script Searcher providers on one desktop row'
          git push
