name: Auto-fix Script Searcher desktop layout

on:
  push:
    paths:
      - '.github/workflows/auto-fix-script-searcher-layout.yml'
      - 'scripts/fix-script-searcher-layout.py'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run desktop Script Searcher layout fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch layout
        run: python scripts/fix-script-searcher-layout.py
      - name: Verify
        run: grep -q 'grid-template-columns: repeat(4, minmax(0, 1fr));' index.html
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f scripts/fix-script-searcher-layout.py
          git rm -f .github/workflows/auto-fix-script-searcher-layout.yml
          git rm -f .github/workflows/apply-script-searcher-layout.yml
          git rm -f .github/workflows/fix-script-searcher-desktop.yml
          git add index.html
          git commit -m 'Keep all Script Searcher providers on one desktop row'
          git push
