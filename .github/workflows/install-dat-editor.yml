name: Install DAT editor
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '    <link rel="stylesheet" href="/tools/dat-editor.css" />\n'
          js = '    <script defer src="/tools/dat-editor.js"></script>\n'
          if '/tools/dat-editor.css' not in s:
              s = s.replace('</head>', css + '</head>', 1)
          if '/tools/dat-editor.js' not in s:
              s = s.replace('</head>', js + '</head>', 1)
          p.write_text(s, encoding='utf-8', newline='\n')
          PY
      - name: Commit index patch
        run: |
          if git diff --quiet -- index.html; then
            echo "DAT editor references already installed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add DAT editor to index"
          git push