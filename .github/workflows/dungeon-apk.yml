name: ltseverydayyou Hub APK

on:
  push:
    branches:
      - main
    paths:
      - android/**
      - .github/workflows/dungeon-apk.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ltseverydayyou-hub-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-replace-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Fetch GitHub profile icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable
          curl -fL --retry 3 "https://avatars.githubusercontent.com/u/117316014?s=512&v=4" -o /tmp/profile-avatar
          python3 - <<'PY'
          from pathlib import Path
          p = Path('/tmp/profile-avatar').read_bytes()
          if p[:8] == b'\x89PNG\r\n\x1a\n':
              Path('android/app/src/main/res/drawable/ic_profile.png').write_bytes(p)
          elif p[:2] == b'\xff\xd8':
              Path('android/app/src/main/res/drawable/ic_profile.jpg').write_bytes(p)
          else:
              raise SystemExit('Unsupported avatar image format')
          PY

      - name: Restore stable debug signing key
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ltseverydayyou-hub-debug-signing-v1
          fail-on-cache-miss: false

      - name: Prepare signing
        shell: bash
        env:
          DUNGEON_KEYSTORE_B64: ${{ secrets.DUNGEON_KEYSTORE_B64 }}
          DUNGEON_KEYSTORE_PASSWORD: ${{ secrets.DUNGEON_KEYSTORE_PASSWORD }}
          DUNGEON_KEY_ALIAS: ${{ secrets.DUNGEON_KEY_ALIAS }}
          DUNGEON_KEY_PASSWORD: ${{ secrets.DUNGEON_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "${DUNGEON_KEYSTORE_B64}" && -n "${DUNGEON_KEYSTORE_PASSWORD}" && -n "${DUNGEON_KEY_ALIAS}" && -n "${DUNGEON_KEY_PASSWORD}" ]]; then
            printf '%s' "${DUNGEON_KEYSTORE_B64}" | base64 --decode > "${GITHUB_WORKSPACE}/android/dungeon-release.jks"
            echo "DUNGEON_KEYSTORE_PATH=${GITHUB_WORKSPACE}/android/dungeon-release.jks" >> "${GITHUB_ENV}"
            echo "SIGNED_RELEASE=true" >> "${GITHUB_ENV}"
            echo "APK_KIND=release-secret-signed" >> "${GITHUB_ENV}"
          else
            if [[ ! -f "${HOME}/.android/debug.keystore" ]]; then
              echo "::error::No stable APK signing identity is available. Configure DUNGEON_KEYSTORE_B64, DUNGEON_KEYSTORE_PASSWORD, DUNGEON_KEY_ALIAS, and DUNGEON_KEY_PASSWORD as repository secrets before rebuilding."
              exit 1
            fi
            keytool -list -keystore "${HOME}/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
            echo "DUNGEON_KEYSTORE_PATH=${HOME}/.android/debug.keystore" >> "${GITHUB_ENV}"
            echo "DUNGEON_KEYSTORE_PASSWORD=android" >> "${GITHUB_ENV}"
            echo "DUNGEON_KEY_ALIAS=androiddebugkey" >> "${GITHUB_ENV}"
            echo "DUNGEON_KEY_PASSWORD=android" >> "${GITHUB_ENV}"
            echo "SIGNED_RELEASE=false" >> "${GITHUB_ENV}"
            echo "APK_KIND=stable-debug-signed" >> "${GITHUB_ENV}"
          fi

      - name: Build replacement APK
        shell: bash
        run: |
          set -euo pipefail
          export VERSION_CODE=$((110100 + GITHUB_RUN_NUMBER))
          export VERSION_NAME="1.1.1"
          mkdir -p dist
          if [[ "${SIGNED_RELEASE}" == "true" ]]; then
            gradle -p android :app:assembleRelease --no-daemon
            cp android/app/build/outputs/apk/release/app-release.apk "dist/ltseverydayyou-Hub.apk"
            APK_KIND="release-signed"
          else
            gradle -p android :app:assembleDebug --no-daemon
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist/ltseverydayyou-Hub.apk"
            APK_KIND="debug-signed"
          fi
          echo "APK_KIND=${APK_KIND}" >> "${GITHUB_ENV}"
          echo "VERSION_CODE=${VERSION_CODE}" >> "${GITHUB_ENV}"

      - name: Verify APK signing identity
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          APK_PATH="dist/ltseverydayyou-Hub.apk"
          "${APKSIGNER}" verify "${APK_PATH}"
          CERT_SHA256="$("${APKSIGNER}" verify --print-certs "${APK_PATH}" 2>/dev/null | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}')"
          if [[ -z "${CERT_SHA256}" ]]; then
            echo "::error::Could not read the APK signing certificate fingerprint."
            exit 1
          fi
          echo "CERT_SHA256=${CERT_SHA256}" >> "${GITHUB_ENV}"
          echo "APK signing certificate: ${CERT_SHA256}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ltseverydayyou-Hub-v1.1.1
          path: dist/ltseverydayyou-Hub.apk

      - name: Replace v1.1.1 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="dungeon-1.1"
          cat > release-notes.md <<EOF_NOTES
          ltseverydayyou Hub v1.1.1

          Android package: ltseverydayyou.dungeon
          Android build: ${VERSION_CODE}
          Android signing: ${APK_KIND}
          Signing certificate SHA-256: ${CERT_SHA256}

          Includes GitHub-profile branding, app-only interface animations, customizable Android launcher icons, live loading from https://ltseverydayyou.github.io/, Windows support, and in-app update notifications.
          EOF_NOTES

          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --title "ltseverydayyou Hub v1.1.1" --notes-file release-notes.md --latest
          else
            gh release create "${TAG}" --target "${GITHUB_SHA}" --title "ltseverydayyou Hub v1.1.1" --notes-file release-notes.md --latest
          fi

          gh release upload "${TAG}" "dist/ltseverydayyou-Hub.apk" --clobber
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets[] | select((.name == "Dungeon.apk") or (.name | endswith(".sha256"))) | .id' | while read -r id; do
            [[ -n "${id}" ]] && gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${id}"
          done
