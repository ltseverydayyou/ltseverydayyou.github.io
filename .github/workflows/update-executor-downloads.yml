name: Update executor quick downloads

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update executor downloads section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          old_button = '<button class="tb" data-t="z">Solara</button>'
          new_button = '<button class="tb" data-t="z">Quick Downloads</button>'
          if text.count(old_button) != 1:
              raise SystemExit(f"expected exactly one Solara tab, found {text.count(old_button)}")
          text = text.replace(old_button, new_button, 1)

          start_marker = '            <section id="pz" class="pp">'
          end_marker = '            <section id="pe" class="pp">'
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit("executor download section markers not found")

          replacement = '''            <section id="pz" class="pp">
              <div class="g ed bootstrapper-catalog">
                  <header class="bootstrapper-catalog__header">
                      <div>
                          <p class="bootstrapper-catalog__eyebrow">Executor downloads</p>
                          <h3>Executor Quick Downloads</h3>
                          <p class="bootstrapper-catalog__intro">
                              Quick access to the current download sources for Solara, Velocity, and Madium.
                          </p>
                      </div>
                      <div class="bootstrapper-catalog__count" aria-label="4 executor downloads">
                          <strong>04</strong>
                          <span>downloads</span>
                      </div>
                  </header>

                  <div class="bootstrappers-grid">
                      <article class="bootstrapper-card bootstrapper-card--featured">
                          <div class="bootstrapper-card__top">
                              <div class="bootstrapper-card__brand">
                                  <img class="bootstrapper-card__logo"
                                      src="https://cdn.discordapp.com/icons/1418732860952809565/3b1855ef741e5c9dc53b4249e64528af.png?size=1024"
                                      alt="Solara logo" />
                                  <div>
                                      <span class="bootstrapper-card__type">Windows executor</span>
                                      <h4 class="bootstrapper-card__name">Solara</h4>
                                  </div>
                              </div>
                              <span class="bootstrapper-card__rank">2 Builds</span>
                          </div>

                          <p class="bootstrapper-card__description">Legacy Solara package and the current Solara V3 executable.</p>

                          <dl class="bootstrapper-card__facts">
                              <div><dt>Builds</dt><dd>Legacy / V3</dd></div>
                              <div><dt>Source</dt><dd>getsolara.dev</dd></div>
                          </dl>

                          <div class="bootstrapper-card__links">
                              <a class="bootstrapper-card__link--primary"
                                  href="https://getsolara.dev/download/static/files/Solara.Dir.zip">
                                  Legacy Solara <span aria-hidden="true">↓</span>
                              </a>
                              <a class="bootstrapper-card__link--primary"
                                  href="https://getsolara.dev/download/static/files/SolaraV3.exe">
                                  Solara V3 <span aria-hidden="true">↓</span>
                              </a>
                          </div>
                      </article>

                      <article class="bootstrapper-card bootstrapper-card--secondary">
                          <div class="bootstrapper-card__top">
                              <div class="bootstrapper-card__brand">
                                  <img class="bootstrapper-card__logo"
                                      src="https://cdn.weao.gg/slug/velocity/logo.png"
                                      alt="Velocity logo" />
                                  <div>
                                      <span class="bootstrapper-card__type">Windows executor</span>
                                      <h4 class="bootstrapper-card__name">Velocity</h4>
                                  </div>
                              </div>
                              <span class="bootstrapper-card__rank">Download</span>
                          </div>

                          <p class="bootstrapper-card__description">Velocity download hosted through GoFile.</p>

                          <dl class="bootstrapper-card__facts">
                              <div><dt>Host</dt><dd>GoFile</dd></div>
                              <div><dt>Source</dt><dd>gofile.io</dd></div>
                          </dl>

                          <div class="bootstrapper-card__links">
                              <a class="bootstrapper-card__link--primary" href="https://gofile.io/d/6HAQxH">
                                  Download Velocity <span aria-hidden="true">↓</span>
                              </a>
                          </div>
                      </article>

                      <article class="bootstrapper-card bootstrapper-card--legacy">
                          <div class="bootstrapper-card__top">
                              <div class="bootstrapper-card__brand">
                                  <img class="bootstrapper-card__logo"
                                      src="https://cdn.weao.gg/slug/madium/logo.png"
                                      alt="Madium logo" />
                                  <div>
                                      <span class="bootstrapper-card__type">Windows executor</span>
                                      <h4 class="bootstrapper-card__name">Madium</h4>
                                  </div>
                              </div>
                              <span class="bootstrapper-card__rank">Download</span>
                          </div>

                          <p class="bootstrapper-card__description">Madium V9 download hosted through FromSmash.</p>

                          <dl class="bootstrapper-card__facts">
                              <div><dt>Version</dt><dd>V9</dd></div>
                              <div><dt>Source</dt><dd>fromsmash.com</dd></div>
                          </dl>

                          <div class="bootstrapper-card__links">
                              <a class="bootstrapper-card__link--primary" href="https://olemad.fromsmash.com/MadiumV9">
                                  Download Madium <span aria-hidden="true">↓</span>
                              </a>
                          </div>
                      </article>
                  </div>
              </div>
          </section>'''

          text = text[:start] + replacement + "\n\n" + text[end:]
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate and commit
        shell: bash
        run: |
          git diff --check
          if git diff --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Expand executor quick downloads"
          git push
