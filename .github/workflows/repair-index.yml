name: Repair index

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-index.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Restore and remove pinned games
        shell: bash
        run: |
          git show HEAD~2:index.html > index.html
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          start = s.index('        <section class="pinned-games" id="pinned-games"')
          depth = 0
          end = None
          for m in re.finditer(r'</?section\\b[^>]*>', s[start:], re.I):
              tag = m.group(0)
              if tag.startswith('</'):
                  depth -= 1
                  if depth == 0:
                      end = start + m.end()
                      break
              else:
                  depth += 1
          if end is None:
              raise RuntimeError('Could not locate pinned games section end')
          s = s[:start] + s[end:]

          css_start = s.index('\n\n        .pinned-games {')
          css_end = s.index('\n</style>', css_start)
          s = s[:css_start] + s[css_end:]

          js_start = s.index('        async function hydratePinnedGameThumbnails() {')
          js_end = s.index('        window.AddHeader = AddHeader;', js_start)
          s = s[:js_start] + s[js_end:]

          s = s.replace('            hydratePinnedGameThumbnails();\n', '')
          s = s.replace('            initPinnedGamePlaces();\n', '')
          s = s.replace('                ".pinned-games",\n', '')
          s = s.replace('                ".pinned-game-card, .private-server-card, .mcp-download, .script-card__button, .btn"', '                ".private-server-card, .mcp-download, .script-card__button, .btn"')

          for line in (
              '        .pinned-games,\n',
              '        .pinned-games:hover,\n',
              '        .pinned-game-card,\n',
              '        .pinned-game-card:hover,\n',
              '        .pinned-game-card:active,\n',
              '            .pinned-games:hover,\n',
          ):
              s = s.replace(line, '')

          if re.search(r'pinned-games|pinned-game|Pinned Games|Games I am actively', s, re.I):
              raise RuntimeError('Pinned games references remain')

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repaired index
        shell: bash
        run: |
          rm .github/workflows/repair-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/repair-index.yml
          git commit -m "Remove pinned games section"
          git push