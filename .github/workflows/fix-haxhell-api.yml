name: Probe HaxHell API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe API hosts
        shell: bash
        run: |
          set -u
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/142.0.0.0 Safari/537.36'
          for host in api.haxhell.com haxhell.com; do
            for with_origin in no yes; do
              echo "===== $host origin=$with_origin ====="
              args=(-sS -D /tmp/headers -o /tmp/body -A "$UA" -H 'Accept: application/json')
              if [ "$with_origin" = yes ]; then
                args+=(-H 'Origin: https://ltseverydayyou.github.io')
              fi
              status=$(curl "${args[@]}" -w '%{http_code}' "https://$host/api/v1/scripts?page=1&limit=1&sort=latest" || true)
              echo "HTTP $status"
              grep -Ei '^(content-type|access-control-allow-origin|access-control-allow-credentials|server|cf-ray):' /tmp/headers || true
              echo 'BODY:'
              head -c 500 /tmp/body || true
              echo
              echo
            done
          done
