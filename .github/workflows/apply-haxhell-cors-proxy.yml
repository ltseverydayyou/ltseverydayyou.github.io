name: Apply HaxHell CORS proxy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify relay can reach HaxHell
        shell: bash
        run: |
          set -euo pipefail
          TARGET='https://haxhell.com/api/v1/scripts?page=1&limit=2&sort=latest'
          ENCODED=$(python -c "import urllib.parse; print(urllib.parse.quote('''$TARGET''', safe=''))")
          curl -fsS -A 'Mozilla/5.0' -H 'Origin: https://ltseverydayyou.github.io' -H 'Accept: application/json' "https://corsproxy.io/?url=$ENCODED" -o /tmp/haxhell.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/haxhell.json').read_text())
          assert isinstance(data.get('data'), list), data
          print('Relay returned', len(data['data']), 'HaxHell script(s)')
          PY
      - name: Patch index
        run: python scripts/patch-haxhell-cors-proxy.py
      - name: Verify patch
        run: |
          grep -q 'https://corsproxy.io/?url=' index.html
          grep -q 'https://haxhell.com/api/v1/search/scripts' index.html
          grep -q 'getHaxHellProxyUrl(rawScriptUrl)' index.html
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/patch-haxhell-cors-proxy.py
          git rm .github/workflows/apply-haxhell-cors-proxy.yml
          git add index.html
          git commit -m 'Route HaxHell through CORS proxy'
          git push
