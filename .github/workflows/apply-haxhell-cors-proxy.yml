name: Probe HaxHell through Jina

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe list and raw endpoints
        shell: bash
        run: |
          set -euo pipefail
          LIST='https://r.jina.ai/https://haxhell.com/api/v1/scripts?page=1&limit=2&sort=latest'
          curl -fsS -A 'Mozilla/5.0' -H 'Origin: https://ltseverydayyou.github.io' -H 'Accept: application/json' "$LIST" -o /tmp/list-reader.json
          python - <<'PY'
          import json
          from pathlib import Path
          outer = json.loads(Path('/tmp/list-reader.json').read_text())
          content = outer['data']['content']
          payload = json.loads(content)
          assert isinstance(payload.get('data'), list) and payload['data'], payload
          raw = payload['data'][0]['links']['raw']
          Path('/tmp/raw-url').write_text(raw)
          print('List OK:', len(payload['data']), 'entries')
          print('Raw URL:', raw)
          PY
          RAW=$(cat /tmp/raw-url)
          curl -fsS -A 'Mozilla/5.0' -H 'Origin: https://ltseverydayyou.github.io' -H 'Accept: application/json' "https://r.jina.ai/$RAW" -o /tmp/raw-reader.json
          python - <<'PY'
          import json
          from pathlib import Path
          outer = json.loads(Path('/tmp/raw-reader.json').read_text())
          content = outer['data']['content']
          assert isinstance(content, str) and content.strip(), outer
          print('Raw content chars:', len(content))
          print('Raw preview:', repr(content[:300]))
          PY
