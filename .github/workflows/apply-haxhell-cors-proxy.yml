name: Apply verified HaxHell Jina relay

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify HaxHell through Jina
        shell: bash
        run: |
          set -euo pipefail
          LIST='https://r.jina.ai/https://haxhell.com/api/v1/scripts?page=1&limit=2&sort=latest'
          curl -fsS -A 'Mozilla/5.0' -H 'Origin: https://ltseverydayyou.github.io' -H 'Accept: application/json' "$LIST" -o /tmp/list-reader.json
          python - <<'PY'
          import json
          from pathlib import Path
          outer = json.loads(Path('/tmp/list-reader.json').read_text())
          payload = json.loads(outer['data']['content'])
          assert isinstance(payload.get('data'), list) and payload['data'], payload
          raw = payload['data'][0]['links']['raw']
          Path('/tmp/raw-url').write_text(raw)
          print('List relay OK:', len(payload['data']), 'entries')
          PY
          RAW=$(cat /tmp/raw-url)
          curl -fsS -A 'Mozilla/5.0' -H 'Origin: https://ltseverydayyou.github.io' -H 'Accept: application/json' "https://r.jina.ai/$RAW" -o /tmp/raw-reader.json
          python - <<'PY'
          import json
          from pathlib import Path
          outer = json.loads(Path('/tmp/raw-reader.json').read_text())
          content = outer['data']['content']
          assert isinstance(content, str) and content.strip(), outer
          print('Raw relay OK:', len(content), 'chars')
          PY
      - name: Patch index
        run: python scripts/patch-haxhell-cors-proxy.py
      - name: Verify patch
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'https://r.jina.ai/' index.html
          grep -q 'https://haxhell.com/api/v1/search/scripts' index.html
          grep -q 'getHaxHellReaderUrl(rawScriptUrl)' index.html
          if grep -q 'https://api.haxhell.com/api/v1/' index.html; then
            echo 'Old API host still present'
            exit 1
          fi
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/patch-haxhell-cors-proxy.py
          git rm .github/workflows/apply-haxhell-cors-proxy.yml
          git add index.html
          git commit -m 'Route HaxHell through verified Jina relay'
          git push
