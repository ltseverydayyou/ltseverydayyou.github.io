name: Probe Jina relay for HaxHell

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Jina Reader
        shell: bash
        run: |
          set -u
          URL='https://r.jina.ai/https://haxhell.com/api/v1/scripts?page=1&limit=2&sort=latest'
          status=$(curl -sS -D /tmp/headers -o /tmp/body -A 'Mozilla/5.0' -H 'Origin: https://ltseverydayyou.github.io' -H 'Accept: application/json' -w '%{http_code}' "$URL" || true)
          echo "HTTP $status"
          grep -Ei '^(content-type|access-control-allow-origin|server):' /tmp/headers || true
          echo '--- BODY ---'
          head -c 3000 /tmp/body || true
          echo
