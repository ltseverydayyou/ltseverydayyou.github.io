name: Patch Solara tab

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch homepage
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("index.html")
          s = path.read_text(encoding="utf-8")

          old_hero = '''                        <p class="hero__eyebrow">
                                      <span>Vyperia Access</span>
                                      <a class="hero__eyebrow-btn" href="https://getsolara.dev/download/static/files/BootstrapperNew.exe"
                                          aria-label="Download BootstrapperNew.exe">
                                          <img class="hero__eyebrow-btn-icon"
                                              src="https://cdn.discordapp.com/icons/1418732860952809565/3b1855ef741e5c9dc53b4249e64528af.png?size=1024"
                                              alt="" />
                                      </a>
                                  </p>
          '''
          if old_hero not in s:
              raise SystemExit("Old Vyperia Access/Solara hero block not found")
          s = s.replace(old_hero, "", 1)

          old_nav = '''                <button class="tb" data-t="u">Bootstrappers</button>
                          <button class="tb" data-t="e">Executors</button>'''
          new_nav = '''                <button class="tb" data-t="u">Bootstrappers</button>
                          <button class="tb" data-t="z">Solara</button>
                          <button class="tb" data-t="e">Executors</button>'''
          if old_nav not in s:
              raise SystemExit("Sidebar insertion point not found")
          s = s.replace(old_nav, new_nav, 1)

          section_anchor = '''            <section id="pe" class="pp">
          '''
          solara_section = '''            <section id="pz" class="pp">
                          <div class="g ed bootstrapper-catalog">
                              <header class="bootstrapper-catalog__header">
                                  <div>
                                      <p class="bootstrapper-catalog__eyebrow">Solara downloads</p>
                                      <h3>Solara</h3>
                                      <p class="bootstrapper-catalog__intro">
                                          Choose between the legacy Solara package and the current Solara V3 executable.
                                      </p>
                                  </div>
                                  <div class="bootstrapper-catalog__count" aria-label="2 Solara downloads">
                                      <strong>02</strong>
                                      <span>downloads</span>
                                  </div>
                              </header>

                              <div class="bootstrappers-grid">
                                  <article class="bootstrapper-card bootstrapper-card--legacy">
                                      <div class="bootstrapper-card__top">
                                          <div class="bootstrapper-card__brand">
                                              <img class="bootstrapper-card__logo"
                                                  src="https://cdn.discordapp.com/icons/1418732860952809565/3b1855ef741e5c9dc53b4249e64528af.png?size=1024"
                                                  alt="Solara logo" />
                                              <div>
                                                  <span class="bootstrapper-card__type">Legacy build</span>
                                                  <h4 class="bootstrapper-card__name">Legacy Solara</h4>
                                              </div>
                                          </div>
                                          <span class="bootstrapper-card__rank">ZIP</span>
                                      </div>

                                      <p class="bootstrapper-card__description">Legacy Solara package distributed as a ZIP archive.</p>

                                      <dl class="bootstrapper-card__facts">
                                          <div><dt>Format</dt><dd>.zip</dd></div>
                                          <div><dt>Source</dt><dd>getsolara.dev</dd></div>
                                      </dl>

                                      <div class="bootstrapper-card__links">
                                          <a class="bootstrapper-card__link--primary"
                                              href="https://getsolara.dev/download/static/files/Solara.Dir.zip">
                                              Download Legacy Solara <span aria-hidden="true">↓</span>
                                          </a>
                                      </div>
                                  </article>

                                  <article class="bootstrapper-card bootstrapper-card--featured">
                                      <div class="bootstrapper-card__top">
                                          <div class="bootstrapper-card__brand">
                                              <img class="bootstrapper-card__logo"
                                                  src="https://cdn.discordapp.com/icons/1418732860952809565/3b1855ef741e5c9dc53b4249e64528af.png?size=1024"
                                                  alt="Solara logo" />
                                              <div>
                                                  <span class="bootstrapper-card__type">Current build</span>
                                                  <h4 class="bootstrapper-card__name">Solara V3</h4>
                                              </div>
                                          </div>
                                          <span class="bootstrapper-card__rank">Recommended</span>
                                      </div>

                                      <p class="bootstrapper-card__description">Current Solara V3 Windows executable.</p>

                                      <dl class="bootstrapper-card__facts">
                                          <div><dt>Format</dt><dd>.exe</dd></div>
                                          <div><dt>Source</dt><dd>getsolara.dev</dd></div>
                                      </dl>

                                      <div class="bootstrapper-card__links">
                                          <a class="bootstrapper-card__link--primary"
                                              href="https://getsolara.dev/download/static/files/SolaraV3.exe">
                                              Download Solara V3 <span aria-hidden="true">↓</span>
                                          </a>
                                      </div>
                                  </article>
                              </div>
                          </div>
                      </section>

          '''
          if section_anchor not in s:
              raise SystemExit("Executor section insertion point not found")
          s = s.replace(section_anchor, solara_section + section_anchor, 1)

          path.write_text(s, encoding="utf-8", newline="\n")
          PY

          grep -q 'data-t="z">Solara<' index.html
          grep -q 'https://getsolara.dev/download/static/files/Solara.Dir.zip' index.html
          grep -q 'https://getsolara.dev/download/static/files/SolaraV3.exe' index.html
          ! grep -q 'Vyperia Access' index.html
          ! grep -q 'BootstrapperNew.exe' index.html

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-solara-tab.yml
          git add index.html
          git commit -m "Add dedicated Solara downloads tab"
          git push